<!DOCTYPE html>
<html>
<body>
<h2>Direct Server Test</h2>
<button onclick="testServer()">Test Server</button>
<div id="result"></div>
<script>
function testServer() {
  fetch('http://localhost:4000/lab5/welcome')
    .then(res => res.text())
    .then(data => document.getElementById('result').innerHTML = 'Success: ' + data)
    .catch(err => document.getElementById('result').innerHTML = 'Error: ' + err);
}
</script>
</body>
</html>
